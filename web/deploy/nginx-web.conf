# Inside the existing `server { listen 443 ssl; server_name picplease.app; ... }` block
# (keep the certificate lines Certbot added). docs/web/deploy.md.
# Needs /etc/nginx/snippets/picplease-web-headers.conf (from nginx-web-headers.conf).

root /var/www/picplease.app/current;
charset utf-8;
# Paths carry only the session id; the secret is in the fragment and never reaches the server.

# Pairing links: always the page itself, never cached, so a deploy takes effect at once.
location /s/ {
    include /etc/nginx/snippets/picplease-web-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
}

# Hashed bundles from Vite: safe to cache for a year.
location /assets/ {
    include /etc/nginx/snippets/picplease-web-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# App link files: JSON, no redirects. Exact matches so Certbot's /.well-known/acme-challenge/
# keeps working.
location = /.well-known/apple-app-site-association {
    include /etc/nginx/snippets/picplease-web-headers.conf;
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}
location = /.well-known/assetlinks.json {
    include /etc/nginx/snippets/picplease-web-headers.conf;
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}

# Which build is live (checked by npm run deploy).
location = /version.json {
    include /etc/nginx/snippets/picplease-web-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}

# Nothing else is served (no landing page yet).
location / {
    include /etc/nginx/snippets/picplease-web-headers.conf;
    return 404;
}
