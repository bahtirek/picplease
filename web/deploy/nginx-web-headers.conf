# Security headers for picplease.app (docs/web/hosting.md). Install as
# /etc/nginx/snippets/picplease-web-headers.conf and include it in every location of the
# picplease.app server block: an add_header inside a location drops the server-level ones.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' mediastream: blob:; connect-src https://api.picplease.app wss://api.picplease.app https://5e30bb91025217d71df1d3412cf6e152.r2.cloudflarestorage.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
