# Inside the existing `server { listen 443 ssl; server_name api.picplease.app; ... }` block
# (keep the certificate lines Certbot added). Replaces the placeholder /health location.

# WebSocket (Realtime). Long read timeout: sockets stay open while a session is active.
location = /ws {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite (not append): the app trusts only 127.0.0.1 and rate limits by this address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
